# Example training config for PEFT/LoRA experiments
model_name: "bigcode/starcoder-base"
train_data: "data/instructions_train.jsonl"
output_dir: "outputs/peft_experiment"
max_length: 1024
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
num_train_epochs: 3
learning_rate: 2e-4
fp16: true
lora:
  r: 16
  alpha: 32
  dropout: 0.05
