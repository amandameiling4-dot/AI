name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ai-app:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr build --registry ${{ secrets.ACR_NAME }} --image $IMAGE_NAME .

      - name: Ensure Container Apps environment exists
        run: |
          if ! az containerapp env show --name "${{ secrets.AZURE_CONTAINER_ENV }}" --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" >/dev/null 2>&1; then
            az containerapp env create \
              --name "${{ secrets.AZURE_CONTAINER_ENV }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --location "${{ secrets.AZURE_LOCATION }}"
          fi

      - name: Deploy Azure Container App
        run: |
          ACR_USERNAME=$(az acr credential show --name "${{ secrets.ACR_NAME }}" --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name "${{ secrets.ACR_NAME }}" --query passwords[0].value -o tsv)
          FULL_IMAGE="${{ secrets.ACR_NAME }}.azurecr.io/$IMAGE_NAME"

          if az containerapp show --name "${{ secrets.AZURE_CONTAINER_APP }}" --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" >/dev/null 2>&1; then
            az containerapp update \
              --name "${{ secrets.AZURE_CONTAINER_APP }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --image "$FULL_IMAGE" \
              --set-env-vars \
                DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
                API_TOKEN="${{ secrets.API_TOKEN }}" \
                REDIS_URL="${{ secrets.REDIS_URL }}"
          else
            az containerapp create \
              --name "${{ secrets.AZURE_CONTAINER_APP }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --environment "${{ secrets.AZURE_CONTAINER_ENV }}" \
              --image "$FULL_IMAGE" \
              --target-port 8000 \
              --ingress external \
              --cpu 0.5 \
              --memory 1.0Gi \
              --registry-server "${{ secrets.ACR_NAME }}.azurecr.io" \
              --registry-username "$ACR_USERNAME" \
              --registry-password "$ACR_PASSWORD" \
              --env-vars \
                DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
                API_TOKEN="${{ secrets.API_TOKEN }}" \
                REDIS_URL="${{ secrets.REDIS_URL }}"
          fi

      - name: Output deployed app URL
        run: |
          az containerapp show --name "${{ secrets.AZURE_CONTAINER_APP }}" --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --query properties.configuration.ingress.fqdn -o tsv
